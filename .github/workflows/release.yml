name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Build, sign, notarize, publish
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile

      - name: Build + release
        uses: tauri-apps/tauri-action@v0
        env:
          # Code-signing + notarization. Set these repository secrets to produce a
          # Gatekeeper-clean, notarized build. WITHOUT them the .dmg builds but is
          # unsigned (users must right-click → Open once). Requires an Apple
          # Developer ID (plan Open Question #1).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DevDock ${{ github.ref_name }}"
          releaseDraft: true
          args: --target universal-apple-darwin
