<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- DevDock menu-bar (tray) TEMPLATE icon — monochrome, alpha-only, simplified to
       two boxes so it reads at 18px. macOS uses the alpha channel and auto-inverts
       (black on light menu bar, white on dark). No color, no gradients, no filters. -->
  <g fill="#000000">
    <rect x="18" y="16" width="46" height="46" rx="12" opacity="0.5"/>
    <rect x="40" y="38" width="46" height="46" rx="12"/>
  </g>
</svg>
